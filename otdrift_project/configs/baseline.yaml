# OpenPLC Runtime Golden Baseline Configuration (YAML)
device_info:
  name: "Line1-OpenPLC-Runtime"
  model: "v3-Docker-Carrier"
  vendor: "OpenPLC Project"
  location: "Plant-A-Cell-02"
  firmware_version: "v3.1.4-LTS"
  serial_number: "PLC-2026-TW-88910"

network:
  ip_address: "192.168.10.50"
  subnet_mask: "255.255.255.0"
  gateway: "192.168.10.1"
  dns_servers:
    - "192.168.10.1"
  dhcp_enabled: false

protocols:
  modbus_tcp:
    enabled: true
    port: 502
    auth_required: true
    allowed_master_ips:
      - "192.168.10.10"
      - "192.168.10.11"
    max_connections: 4
    slave_id: 1
    timeout_ms: 3000
  ethernet_ip:
    enabled: false
    port: 44818
  dnp3:
    enabled: false
    port: 20000

management:
  web_admin_enabled: false
  web_admin_port: 8080
  allow_remote_programming: false
  ssh_access: false
  telnet_access: false
  password_complexity_enforced: true
  session_timeout_seconds: 300
  allowed_admin_subnets:
    - "192.168.10.0/24"

safety_and_integrity:
  plc_mode: "RUN"
  watchdog_timer_ms: 500
  read_only_registers:
    - "%MW0-%MW100"
    - "%IX0.0-%IX0.7"
  program_checksum: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
  integrity_hash_algorithm: "SHA-256"
